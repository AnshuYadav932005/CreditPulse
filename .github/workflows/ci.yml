name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: PYTHONPATH=src pytest tests/test_features.py tests/test_models.py -q
      - name: Full pipeline + API tests
        run: PYTHONPATH=src python -m finsight.pipeline && PYTHONPATH=src pytest tests/test_api.py -q
